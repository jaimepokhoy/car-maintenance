name: Web preview

# Publishes the web build to GitHub Pages for testing: https://<owner>.github.io/<repo>/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pages serves the site under /<repo>, so set the base path for this build only (read by app.config.ts).
      - run: npx expo export --platform web
        env:
          WEB_BASE_URL: /${{ github.event.repository.name }}
      # Pages has no rewrites; serving the app as the 404 page makes deep links and refreshes work.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
