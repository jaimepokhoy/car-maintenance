name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --ci
      - name: Edge Function domain copy matches src/domain
        run: node scripts/sync-function-domain.js --check
      - name: Bundle default tenant (iOS and Android)
        run: npx expo export --platform ios --platform android --output-dir dist
      - name: Bundle demo-shop tenant (iOS and Android)
        run: npx expo export --platform ios --platform android --output-dir dist/demo-shop
        env:
          TENANT: demo-shop

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions/send-campaign
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck
        run: deno check index.ts store.ts
      - name: Test
        run: deno test
